services:
  - type: web
    name: gateproxy
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: BIND_HOST
        value: "0.0.0.0"
      - key: CACHE_TTL_MS
        value: "60000"
      - key: CACHE_CAPACITY
        value: "128"
